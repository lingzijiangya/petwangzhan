<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>宠物养育</title>
<style>
*{box-sizing:border-box}
:root{
  --orange:#ff812d;--light:#fff8eb;--yellow:#ffe28b;
  --line:#f1d7ad;--text:#221e1b;--muted:#999;
}
html,body{margin:0;background:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
button,input{font:inherit;border:0;outline:0}
button{cursor:pointer}
#app{width:100%;max-width:750px;min-height:100vh;margin:auto;background:var(--light);position:relative;overflow:hidden}
.page{min-height:100vh;padding-bottom:92px;background:linear-gradient(#ffe083 0,#fff8eb 430px)}
.page.white{background:#fff}
.header{height:190px;padding:54px 40px 0;position:relative}
.header h1{font-size:38px;font-weight:400;margin:55px 0 0}
.header .back{position:absolute;left:40px;top:94px}
.back,.icon-btn{width:76px;height:76px;border-radius:15px;background:#fff8ef;box-shadow:0 4px 12px #df9a3020;font-size:48px;color:var(--orange);line-height:60px}
.header .back+h1{margin-left:120px;margin-top:-2px}
.icon-btn{font-size:32px;color:#111;line-height:76px;text-align:center}
.search-icon{position:absolute;right:40px;top:94px}
.content{padding:0 30px}
.card{background:#fffaf0;border:1px solid var(--line);border-radius:28px;box-shadow:0 3px 10px #e9bd7020;padding:24px;margin-bottom:20px}
.orange{color:var(--orange)}
.muted{color:#aaa}
.small{font-size:20px}.title{font-size:27px}.section-title{font-size:28px;margin:28px 0 18px}
.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:750px;height:92px;background:#fff;display:flex;justify-content:space-around;padding-top:13px;border-top:1px solid #eee}
.bottom button{background:none;color:#cfd5e0;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottom button.active{color:#222}.bottom .ico{font-size:31px;line-height:34px}
.hero{height:407px;padding:76px 42px 0;background:linear-gradient(135deg,#ffd279,#ff985d);color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:38px;font-weight:400;line-height:1.8;margin:0}
.hero img{position:absolute;bottom:-10px;left:0;width:100%;height:310px;object-fit:cover;mix-blend-mode:multiply}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.feature{background:#fffaf0;border:1px solid var(--line);border-radius:24px;text-align:center;padding:20px 4px;font-size:18px}
.feature b{display:block;width:72px;height:72px;margin:auto auto 14px;border-radius:18px;background:#ffad22;color:#fff;font-size:40px;line-height:72px}
.feature:nth-child(2) b{background:#54ce76}.feature:nth-child(3) b{background:#8d56e8}.feature:nth-child(4) b{background:#4b8ce5}
.pet-box{display:flex;gap:24px;align-items:center}
.pet-box img{width:58%;height:250px;object-fit:cover;border-radius:24px}
.tags span,.pill{display:inline-block;background:#ffdcab;color:var(--orange);padding:8px 18px;border-radius:24px;margin:7px 0;font-size:18px}
.reminder{display:flex;align-items:center;justify-content:space-between;font-size:22px}
.primary{background:var(--orange);color:white;padding:14px 28px;border-radius:30px}
.profile{display:flex;align-items:center;gap:25px;padding:0 40px 25px}
.avatar{width:125px;height:125px;border-radius:50%;object-fit:cover;border:4px solid white}
.stats{background:#ffa900;padding:25px;border-radius:28px}
.stats-inner{background:#fff;border-radius:20px;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:22px 5px;font-size:19px}
.stats strong{font-size:38px;font-weight:400;display:block}
.row{display:flex;justify-content:space-between;align-items:center;padding:22px 8px;border-bottom:1px solid #ecd9bb;font-size:23px}
.row:last-child{border-bottom:0}
.circle-pet{display:block;width:365px;height:365px;border-radius:50%;object-fit:cover;margin:15px auto 20px;border:3px solid #f7c99a}
.score{display:flex;align-items:center;gap:22px}.heart{width:108px;height:108px;border-radius:22px;background:linear-gradient(135deg,#ffac29,#ff702d);color:white;font-size:56px;text-align:center;padding-top:17px}
.stars{color:var(--orange);font-size:38px;margin-left:auto}
.tabs{display:flex;justify-content:space-around;background:#fffaf0;border:1px solid var(--line);padding:8px;border-radius:28px;margin-bottom:28px;font-size:24px}
.tabs button{background:none;padding:12px 27px;border-radius:28px}.tabs .sel{background:var(--orange);color:#fff}
.health-item{display:flex;align-items:center;gap:20px}.health-icon{font-size:48px;color:var(--orange);width:105px;text-align:center}.health-item h3{margin:0 0 8px;font-size:24px;font-weight:400}.status{margin-left:auto;background:#dff6d4;color:#62bd4a;border-radius:20px;padding:10px 18px}
.feed-card{padding:22px 22px}.feed-head{display:flex;align-items:center;gap:16px}.feed-head img{width:68px;height:68px;border-radius:50%;object-fit:cover}.follow{margin-left:auto;border:2px solid var(--orange);color:var(--orange);background:none;border-radius:28px;padding:8px 22px}.feed-text{font-size:21px;line-height:1.65}.feed-images{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.feed-images img{width:100%;height:145px;object-fit:cover;border-radius:18px}.actions{text-align:right;font-size:20px;padding-top:12px}
.topic-box{display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:24px}.topic-box span{color:var(--orange)}
.qa-search{height:84px;background:#fff;border-radius:18px;padding:20px 28px;font-size:24px;width:100%;box-shadow:0 3px 10px #e9bd7020}
.hot{font-size:26px;margin:35px 0 20px}.qa-card{position:relative;padding:24px 28px;font-size:22px}.qa-card .arrow{position:absolute;right:28px;top:28px;color:var(--orange);font-size:34px}.qa-card p{font-size:17px;color:var(--orange);margin:22px 0 0}
.detail-title{font-size:28px;line-height:1.5}.detail-text{font-size:21px;line-height:1.8;color:#777}
.post-detail{padding:0 40px}.post-detail h2{font-size:28px;font-weight:400}.post-detail>img{width:100%;height:320px;object-fit:cover;border-radius:22px}
.article{font-size:21px;line-height:1.9}.article h3{color:var(--orange);font-weight:400}
.inputbar{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);max-width:750px;width:100%;background:#fff;padding:16px 30px;display:flex;gap:15px}.inputbar input{background:#fff6ee;padding:18px;border-radius:12px;flex:1}.inputbar button{padding:0 25px;border-radius:12px;background:#eee;color:#999}
@media(min-width:751px){#app{box-shadow:0 0 30px #aaa}.bottom{position:absolute}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const img={
 dog:"https://images.unsplash.com/photo-1552053831-71594a27632d?w=800",
 dog2:"https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800",
 cat:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800",
 cat2:"https://images.unsplash.com/photo-1574158622682-e40e69881006?w=800",
 pets:"https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=1000",
 user:"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200"
};
let state={page:"home",healthTab:"疫苗",follow:false,liked:false};
const app=document.querySelector("#app");
function nav(){
return `<nav class="bottom">
<button class="${state.page==='home'?'active':''}" onclick="go('home')"><span class="ico">🏠</span>首页</button>
<button class="${state.page==='circle'?'active':''}" onclick="go('circle')"><span class="ico">🐱</span>朋友圈</button>
<button class="${state.page==='qa'?'active':''}" onclick="go('qa')"><span class="ico">🖐</span>问答</button>
<button class="${state.page==='mine'?'active':''}" onclick="go('mine')"><span class="ico">👩</span>我的</button>
</nav>`}
function shell(body,cls=""){return `<main class="page ${cls}">${body}${nav()}</main>`}
function go(p){state.page=p;render()} function back(){history.length>1?history.back():go("home")}
function header(title,search=false){return `<header class="header"><button class="back" onclick="back()">‹</button><h1>${title}</h1>${search?'<button class="icon-btn search-icon">⌕</button>':''}</header>`}
function home(){return shell(`<section class="hero"><h1>我是你的<br>宠物搭子～</h1><img src="${img.pets}"></section><div class="content">
<div class="card feature-grid">
<div class="feature" onclick="go('archive')"><b>▤</b>宠物档案</div><div class="feature"><b>✓</b>体重管理</div><div class="feature"><b>★</b>饮食计划</div><div class="feature" onclick="go('health')"><b>▮</b>健康记录</div>
</div><div class="card"><div class="title">我的宠物</div><div class="pet-box"><img src="${img.dog}"><div><div class="orange title">豆豆</div><p class="muted">泰迪</p><div class="tags"><span>2岁6个月</span><br><span>已绝育</span><br><span>3.6kg</span></div></div></div></div>
<div class="card reminder"><div>今日提醒<br><span class="orange">驱虫（内服）</span><br><small class="orange">今天20:00</small></div><button class="primary" onclick="this.textContent='已完成'">去完成</button></div></div>`)}
function archive(){return shell(header("宠物档案")+`<div class="content"><img class="circle-pet" src="${img.dog2}"><div class="card score"><div class="heart">♥</div><div><div class="title">健康评分</div><b style="font-size:36px">92</b> <span style="color:#62bd4a;font-size:23px">优秀</span></div><div class="stars">★★★★</div></div><div class="section-title">基本信息</div><div class="card">${[['品种','泰迪'],['性别','女生'],['生日','2024-03-04'],['体重','3.6kg']].map(x=>`<div class="row"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div><div class="section-title">健康记录</div><div class="card"><div class="health-item"><div><div class="title">疫苗接种</div><span class="orange">2025-12-01</span></div><span class="status">已完成</span></div></div></div>`)}
function health(){let data=state.healthTab==='疫苗'?[['猫三联疫苗','爱宠物动物医院','2025-12-01','已完成'],['狂犬病疫苗','爱宠物动物医院','2025-11-22','已完成'],['猫白血病疫苗','爱宠物动物医院','2026-11-22','待接种']]:[['体重记录','家庭记录','3.6kg','已记录']];return shell(header("健康记录")+`<div class="content"><div class="feature-grid"><div class="feature">💉<br>疫苗<br>2/3</div><div class="feature">💊<br>驱虫<br>按时</div><div class="feature">⚖️<br>体重<br>3.6kg</div><div class="feature">✂️<br>美容<br>1次</div></div><div class="tabs" style="margin-top:30px">${['疫苗','驱虫','体重','美容'].map(x=>`<button class="${state.healthTab===x?'sel':''}" onclick="state.healthTab='${x}';render()">${x}</button>`).join('')}</div>${data.map(x=>`<div class="card health-item"><div class="health-icon">💉</div><div><h3>${x[0]}</h3>${x[1]}<br><span class="orange">接种日期：${x[2]}</span></div><span class="status">${x[3]}</span></div>`).join('')}</div>`)}
function circle(){return shell(header("朋友圈",true)+`<div class="content"><div class="card topic-box"><span># 新手养宠</span><span># 今天你遛狗了吗</span><span># 萌宠日常</span><span># 养宠心情</span></div>${feed(img.dog2,'自由自在','猫咪换季脱毛护理指南，铲屎官必看！')}${feed(img.cat,'小米','自己养的猫咪长大了好多～有猫咪的生活真的很治愈！')}</div>`)}
function feed(image,name,text){return `<div class="card feed-card"><div class="feed-head"><img src="${image}"><div>${name}<br><small class="muted">2天前发布</small></div><button class="follow" onclick="this.textContent=this.textContent==='关注'?'已关注':'关注'">${state.follow?'已关注':'关注'}</button></div><p class="feed-text">${text}</p><div class="feed-images"><img src="${img.dog}"><img src="${img.cat2}"><img src="${img.dog2}"></div><div class="actions">💬 23　<button onclick="this.textContent='♥ 135'">♡ 134</button></div></div>`}
function qa(){let qs=['猫咪为什么会突然不吃东西？','英短猫多久洗一次澡比较好？','狗狗媒体需要散步多长时间？','宠物猫的理想体重是多少？','猫咪发烧了怎么判断和处理？'];return shell(`<div class="header"><h1>宠物问答</h1></div><div class="content"><input class="qa-search" placeholder="⌕  搜索宠物问题..."><div class="hot">🔥 热门话题</div><div class="tabs"><button class="sel">最热</button><button>最新</button><button>精华</button></div>${qs.map((q,i)=>`<div class="card qa-card" onclick="go('question')">${q}<span class="arrow">›</span><p>健康管理　　2232浏览　　14回答</p></div>`).join('')}</div>`)}
function question(){return shell(header("问题详情"),"white")+`<div class="content"><span class="pill">猫咪行为</span><span class="muted title"> 健康管理</span><h2 class="detail-title">猫咪为什么会突然不吃东西？</h2><p class="detail-text">我家英短最近两天突然不吃猫粮了，以前吃得很好的，也没有换粮，精神状态看起来还可以，但是就是不愿意吃东西，喝水也比平时少一些。请问这是什么原因？需要去医院吗？</p><hr><div class="card"><h3>资深铲屎官小李　<span class="pill">宠物达人</span></h3><p class="article">猫咪突然不吃东西可能有很多原因。首先要排查是否更换了猫粮品牌或口味，其次检查猫咪是否有口腔问题。另外，环境改变、压力、天气变化也会影响食欲。<br><br>如果超过24小时完全不进食，建议尽快就医。</p></div></div>`}
function post(){return shell(header("帖子详情"),"white")+`<article class="post-detail"><div class="feed-head"><img src="${img.dog2}" class="avatar"><div>自由自在<br><small class="muted">2天前发布</small></div><button class="follow">关注</button></div><h2>🔥 猫咪换季脱毛护理指南，铲屎官必看！</h2><img src="${img.cat2}"><div class="article"><p>每到换季时期，猫咪大量脱毛让很多铲屎官头疼不已。今天来分享我三年养猫经验总结出的护理方案！</p><h3>一.日常梳毛</h3><p>换季期间建议每天梳毛，不仅能减少脱落毛发散落在家中，还能促进血液循环。</p><h3>二.饮食调节</h3><p>适当增加富含omega-3脂肪酸的食物，可以显著改善毛发质量。</p><h3>三.保持水分</h3><p>换季时空气干燥，要确保猫咪充足饮水。</p></div></article>`}
function mine(){return shell(`<div class="header"><h1>我的</h1><button class="icon-btn search-icon">⚙</button></div><div class="profile"><img class="avatar" src="${img.cat}"><div class="title">奶茶的铲屎官<br><small>养猫三年·英短爱好者·上海</small></div></div><div class="content"><div class="stats"><div class="stats-inner">${[['23','动态'],['156','关注'],['1.2k','粉丝'],['3.4k','获赞']].map(x=>`<div><strong>${x[0]}</strong>${x[1]}</div>`).join('')}</div></div><div class="section-title">我的宠物</div><div class="card row"><span>🐱　奶茶<br><small class="orange">英短·2岁</small></span><span class="orange">＋ 添加</span></div><div class="card">${['基本资料','武道商城','意见反馈','当前版本：1.1.1','退出登录'].map(x=>`<div class="row">${x}<span class="orange">›</span></div>`).join('')}</div></div>`)}
function render(){let out={home,archive,health,circle,qa,question,post,mine}[state.page]||home;app.innerHTML=out()}
render();
</script>
</body>
</html>
